function renderSpecialists(){let c=document.getElementById('content');if(specialistTabId){let s=spec(specialistTabId);if(!s){specialistTabId=null;return renderSpecialists()}c.innerHTML=`<div class="topline"><div><button onclick="specialistTabId=null;renderSpecialists()">← Specialisti</button><h2 style="margin-top:12px">${esc(s.name)}</h2><p class="muted">${esc(s.discipline)}</p></div><button class="primary" onclick="editSpecialist('${s.id}')">Modifica scheda</button></div><div class="card"><h3>Dati professionali e accordo</h3><div class="details">${[['Specializzazione',s.discipline],['Email',s.email],['Telefono',s.phone],['Albo / iscrizione',s.albo],['Tipo accordo',({percent:'Percentuale',fixed:'Importo fisso per visita',rent:'Affitto mensile',mixed:'Personalizzato'})[s.agreement]||'Non definito'],['Valore accordo',s.agreement==='percent'?s.rate+'%':eur(s.rate)]].map(([k,v])=>`<div><label>${k}</label><b>${esc(v||'—')}</b></div>`).join('')}</div></div><div class="card"><h3>Attività e contabilità</h3><p>Appuntamenti registrati: ${appointments.filter(a=>a.specialist===s.id).length}</p><p>Compensi stimati: ${eur(demoInvoices.filter(i=>i.specialist===s.id).reduce((sum,i)=>sum+(s.agreement==='percent'?i.total*s.rate/100:s.agreement==='fixed'?Number(s.rate):0),0))}</p><p class="muted">Valori dimostrativi, non liquidazioni fiscali.</p></div>`;return}

function editSpecialist(id){let s=id?spec(id):{};document.getElementById('modal').innerHTML=`<h2>${id?'Modifica specialista':'Nuovo specialista'}</h2><form onsubmit="saveSpecialist(event,'${id||''}')"><div class="formgrid">${[['name','Nome e cognome'],['discipline','Specializzazione'],['email','Email'],['phone','Telefono'],['albo','Albo / iscrizione']].map(([k,l])=>`<div class="field"><label>${l}</label><input name="${k}" value="${esc(s[k]||'')}" ${k==='name'||k==='discipline'?'required':''}></div>`).join('')}<div class="field"><label>Tipo accordo</label><select name="agreement">${[['percent','Percentuale'],['fixed','Fisso a visita'],['rent','Affitto mensile'],['mixed','Personalizzato']].map(([k,l])=>`<option value="${k}" ${s.agreement===k?'selected':''}>${l}</option>`).join('')}</select></div><div class="field"><label>Valore (% o €)</label><input type="number" step="0.01" min="0" name="rate" value="${esc(s.rate??0)}"></div></div><div class="actions"><button type="button" onclick="closeModal()">Annulla</button><button class="primary">Salva</button></div></form>`;showModal()}

function saveInvoice(e){e.preventDefault();let v=Object.fromEntries(new FormData(e.target));v.total=Number(v.total);v.date=iso(new Date());v.number='DEMO-'+String(demoInvoices.length+1).padStart(4,'0');demoInvoices.push(v);closeModal();if(patientId){patientTab='fatture';renderPatient()}else render()}

function openExpense(){document.getElementById('modal').innerHTML=`<h2>Registra uscita dimostrativa</h2><form onsubmit="saveExpense(event)"><div class="field"><label>Categoria</label><select name="category"><option>Materiali</option><option>Affitto</option><option>Utenze</option><option>Software</option><option>Compensi</option><option>Altro</option></select></div><div class="field"><label>Descrizione</label><input name="description" required></div><div class="field"><label>Importo €</label><input type="number" min="0.01" step="0.01" name="amount" required></div><div class="actions"><button type="button" onclick="closeModal()">Annulla</button><button class="primary">Registra</button></div></form>`;showModal()}

function v52CanEdit(r){return role!=='specialista'||r.specialist==='s1'}
const v52PreviousPatient=renderPatient;
renderPatient=function(){v52PreviousPatient();if(!patientId||patientTab!=='storico')return;v52DrawHistory()};
function v52DrawHistory(){
 const p=pat(patientId),pane=document.getElementById('ptab');if(!p||!pane)return;
 const records=v52VisibleRecords(p.id).sort((a,b)=>(b.date+b.created).localeCompare(a.date+a.created));
 const last=records[0];const next=v5Recalls.filter(r=>r.patient===p.id&&!r.done&&r.date>=iso(new Date())).sort((a,b)=>a.date.localeCompare(b.date))[0];
 pane.innerHTML=`<div class="topline"><div><h3>Storico clinico</h3><p class="muted">Visite, osservazioni, trattamenti e indicazioni di controllo</p></div><button class="primary" onclick="v52OpenVisit()">+ Registra visita</button></div><div class="history-help">Prototipo con dati fittizi: le note sono conservate soltanto nella memoria della pagina. Nel sistema definitivo serviranno permessi clinici granulari, firma/attribuzione, tracciabilità e rettifiche non distruttive.</div><div class="history-summary"><div>Visite registrate<strong>${records.length}</strong></div><div>Ultima visita<strong style="font-size:16px">${last?esc(last.date):'—'}</strong></div><div>Prossimo richiamo<strong style="font-size:16px">${next?esc(next.date):'—'}</strong></div></div><div class="history-toolbar"><input id="v52query" type="search" placeholder="Cerca nello storico" oninput="v52FilterHistory()"><select id="v52specialist" onchange="v52FilterHistory()"><option value="">Tutti gli specialisti autorizzati</option>${v52AllowedSpecialists().map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('')}</select><select id="v52sort" onchange="v52FilterHistory()"><option value="desc">Più recenti</option><option value="asc">Meno recenti</option></select></div><div id="v52results"></div>`;
 v52FilterHistory();
}
function v52FilterHistory(){
 const target=document.getElementById('v52results');if(!target)return;
 const q=(document.getElementById('v52query')?.value||'').toLocaleLowerCase('it');const sid=document.getElementById('v52specialist')?.value||'';const sort=document.getElementById('v52sort')?.value||'desc';
 let arr=v52VisibleRecords(patientId).filter(r=>(!sid||r.specialist===sid)&&[r.reason,r.observation,r.treatment,r.followup,spec(r.specialist)?.name].join(' ').toLocaleLowerCase('it').includes(q)).sort((a,b)=>sort==='asc'?(a.date+a.created).localeCompare(b.date+b.created):(b.date+b.created).localeCompare(a.date+a.created));
 target.innerHTML=arr.map(r=>`<div class="history-record"><div class="topline"><div><h4>${esc(r.date)} · ${esc(spec(r.specialist)?.name||'Specialista')}</h4><p class="muted">${esc(spec(r.specialist)?.discipline||'')} · ${r.appointment?`Collegata ad appuntamento`: 'Registrazione manuale'} · ${r.amended?'Rettificata':'Originale'}</p></div><button onclick="v52ShowVisit('${r.id}')">Apri scheda visita</button></div><div class="history-columns"><div><label>Motivo della visita</label><div class="history-detail">${esc(r.reason||'—')}</div></div><div><label>Osservazioni</label><div class="history-detail">${esc(r.observation||'—')}</div></div><div><label>Trattamento / attività</label><div class="history-detail">${esc(r.treatment||'—')}</div></div><div><label>Indicazioni successive</label><div class="history-detail">${esc(r.followup||'—')}</div></div></div></div>`).join('')||'<div class="empty">Nessuna visita registrata con questi filtri. Usa “Registra visita” per aggiungerne una dimostrativa.</div>';
}
function v52OpenVisit(){
 const pid=patientId,p=pat(pid);if(!p)return;
 const allowed=v52AllowedSpecialists();const apts=appointments.filter(a=>a.patient===pid&&allowed.some(s=>s.id===a.specialist));
 document.getElementById('modal').innerHTML=`<h2>Registra visita — ${esc(p.name)}</h2><div class="history-help">Usa soltanto informazioni inventate. La demo non è idonea a conservare dati clinici reali.</div><form onsubmit="v52SaveVisit(event)"><div class="formgrid"><div class="field"><label>Data della visita</label><input name="date" type="date" value="${iso(new Date())}" required></div><div class="field"><label>Specialista</label><select name="specialist" required>${allowed.map(s=>`<option value="${esc(s.id)}">${esc(s.name)} · ${esc(s.discipline)}</option>`).join('')}</select></div></div><div class="field"><label>Collega a un appuntamento (facoltativo)</label><select name="appointment"><option value="">Nessun appuntamento</option>${apts.map(a=>`<option value="${esc(a.id)}">${esc(a.date)} · ${esc(a.time)} · ${esc(spec(a.specialist)?.name)}</option>`).join('')}</select></div><div class="field"><label>Motivo della visita</label><input name="reason" maxlength="240" required placeholder="Es. Controllo periodico"></div><div class="field"><label>Osservazioni</label><textarea name="observation" rows="3" placeholder="Annotazioni della visita"></textarea></div><div class="field"><label>Trattamento / attività svolta</label><textarea name="treatment" rows="3"></textarea></div><div class="field"><label>Indicazioni e prossimo controllo</label><textarea name="followup" rows="2"></textarea></div><div class="field"><label><input type="checkbox" name="makeRecall" value="yes"> Programma anche un richiamo</label></div><div class="field"><label>Data richiamo (se selezionato)</label><input name="recallDate" type="date"></div><div class="actions"><button type="button" onclick="closeModal()">Annulla</button><button class="primary">Salva visita demo</button></div></form>`;showModal();
}
function v52SaveVisit(e){e.preventDefault();const v=Object.fromEntries(new FormData(e.target));if(!patientId||!v52AllowedSpecialists().some(s=>s.id===v.specialist)){alert('Specialista non autorizzato.');return}if(v.appointment){const a=appointments.find(x=>x.id===v.appointment&&x.patient===patientId&&x.specialist===v.specialist);if(!a){alert('L’appuntamento selezionato non appartiene a questo paziente e specialista.');return}}
 if(v.makeRecall==='yes'&&!v.recallDate){alert('Seleziona la data del richiamo.');return}
 const id='visit'+Date.now();v52Records.push({...v,id,patient:patientId,created:new Date().toISOString(),amended:false,corrections:[]});if(v.makeRecall==='yes')v5Recalls.push({id:'r'+Date.now(),patient:patientId,date:v.recallDate,reason:'Controllo programmato dopo visita',done:false});v5Log('Visita demo registrata',patientId);closeModal();patientTab='storico';renderPatient();
}
function v52ShowVisit(id){const r=v52VisibleRecords(patientId).find(x=>x.id===id);if(!r)return;document.getElementById('modal').innerHTML=`<h2>Visita del ${esc(r.date)}</h2><p><b>Paziente:</b> ${esc(pat(r.patient)?.name)}</p><p><b>Specialista:</b> ${esc(spec(r.specialist)?.name)}</p><div class="history-columns">${[['Motivo',r.reason],['Osservazioni',r.observation],['Trattamento',r.treatment],['Indicazioni successive',r.followup]].map(([k,v])=>`<div><label>${k}</label><div class="history-detail">${esc(v||'—')}</div></div>`).join('')}</div><h3>Rettifiche</h3>${r.corrections.map(c=>`<div class="history-record"><b>${esc(c.when)}</b><p class="history-detail">${esc(c.text)}</p></div>`).join('')||'<p class="muted">Nessuna rettifica</p>'}<div class="actions">${v52CanEdit(r)?`<button onclick="v52OpenCorrection('${r.id}')">Aggiungi rettifica</button>`:''}<button onclick="closeModal()">Chiudi</button></div>`;showModal()}
function v52OpenCorrection(id){const r=v52VisibleRecords(patientId).find(x=>x.id===id);if(!r||!v52CanEdit(r))return;document.getElementById('modal').innerHTML=`<h2>Rettifica visita del ${esc(r.date)}</h2><div class="history-help">La rettifica viene aggiunta senza cancellare le note precedenti. Nella versione reale richiederà attribuzione certa all'operatore.</div><form onsubmit="v52SaveCorrection(event,'${r.id}')"><div class="field"><label>Motivo e contenuto della rettifica</label><textarea name="text" required rows="5" maxlength="4000"></textarea></div><div class="actions"><button type="button" onclick="v52ShowVisit('${r.id}')">Annulla</button><button class="primary">Registra rettifica</button></div></form>`;showModal()}
function v52SaveCorrection(e,id){e.preventDefault();const r=v52VisibleRecords(patientId).find(x=>x.id===id);if(!r||!v52CanEdit(r))return;const text=new FormData(e.target).get('text')?.trim();if(!text)return;r.corrections.push({when:new Date().toLocaleString('it-IT'),text});r.amended=true;v5Log('Rettifica visita demo',patientId);closeModal();renderPatient()}
// Includi le visite nella timeline senza esporre il testo clinico.
const v52PreviousTimeline=renderPatient;
renderPatient=function(){v52PreviousTimeline();if(patientTab!=='timeline'||!patientId)return;let timeline=document.querySelector('#ptab .v5timeline');if(!timeline)return;let visits=v52VisibleRecords(patientId);if(!visits.length)return;let all=[...visits.map(r=>({date:r.date,html:`<div class="v5event"><b>${esc(r.date)} · Visita clinica</b><p class="muted">${esc(spec(r.specialist)?.name)} · <button onclick="patientTab='storico';renderPatient()">Apri storico clinico</button></p></div>`})),...Array.from(timeline.children).map(el=>({date:(el.textContent||'').trim().slice(0,10),html:el.outerHTML}))].sort((a,b)=>b.date.localeCompare(a.date));timeline.innerHTML=all.map(x=>x.html).join('')}
</script>
<script>
// V5.3 — workflow amministrativo dimostrativo, solo dati sintetici e memoria volatile.
const v53Practices=[];
const v53Find=id=>v53Practices.find(p=>p.id===id);
const v53ByApt=id=>v53Practices.find(p=>p.appointment===id&&p.state!=='annullata');
function v53Complete(id){
 const a=appointments.find(x=>x.id===id);if(!a)return;
 if(!pat(a.patient)||!spec(a.specialist)){alert('Collegamento paziente o specialista non valido.');return}
 v5Statuses[id]='Visita conclusa';v5Log('Visita conclusa',id);
 let p=v53ByApt(id);
 if(!p){p={id:'pr'+Date.now()+'_'+Math.floor(Math.random()*10000),appointment:id,patient:a.patient,specialist:a.specialist,date:a.date,amount:null,state:'bozza',payment:'Non pagato',method:'',created:iso(new Date()),number:null};v53Practices.push(p);v5Log('Bozza amministrativa creata',p.id)}
 v53Edit(p.id);
}
const v53OldSetStatus=v5SetStatus;
v5SetStatus=function(id,status){if(status==='Visita conclusa'){v53Complete(id);return}v53OldSetStatus(id,status)};
const v53OldShowApt=showApt;
showApt=function(id){v53OldShowApt(id);const a=appointments.find(x=>x.id===id);if(!a)return;let p=v53ByApt(id),m=document.getElementById('modal');let d=document.createElement('div');d.className='card';d.innerHTML=`<h3>Amministrazione visita</h3><p class="muted">${p?'Pratica: '+esc(p.state):'Nessuna pratica creata'}</p><div class="actions"><button class="primary" onclick="v53Complete('${id}')">${p?'Apri pratica':'Concludi visita e apri pratica'}</button></div>`;m.appendChild(d)};
function v53Edit(id){let p=v53Find(id);if(!p)return;let a=appointments.find(x=>x.id===p.appointment);if(!a)return;
 document.getElementById('modal').innerHTML=`<h2>Pratica della visita · Demo</h2><div class="warn">Nessun documento fiscale valido viene emesso. La mancata approvazione NON elimina l'obbligo di documentare fiscalmente l'operazione.</div><div class="patient-match"><b>${esc(pat(p.patient)?.name)}</b> · ${esc(pat(p.patient)?.cf)}<br>${esc(pat(p.patient)?.phone)} · ${esc(pat(p.patient)?.email)}</div><p><b>Visita:</b> ${esc(a.date)} ${esc(a.time)} · ${esc(spec(p.specialist)?.name)}</p><p><b>Stato pratica:</b> ${esc(p.state)}</p>${p.state==='bozza'?`<form onsubmit="v53Decision(event,'${id}')"><div class="field"><label>Importo €</label><input name="amount" type="number" min="0.01" step="0.01" required value="${p.amount??''}"></div><div class="field"><label>Descrizione amministrativa</label><input name="description" required value="${esc(p.description||'Visita')}"></div><div class="field"><label>Stato del pagamento</label><select name="payment"><option ${p.payment==='Non pagato'?'selected':''}>Non pagato</option><option ${p.payment==='Pagato'?'selected':''}>Pagato</option></select></div><div class="field"><label>Metodo se pagato</label><select name="method"><option value="">Da scegliere</option>${['Contanti','POS','Bonifico'].map(x=>`<option ${p.method===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="actions"><button class="primary" type="submit" name="decision" value="approve">Approva bozza fattura</button><button type="submit" name="decision" value="unapproved">Non approvare · registra pratica</button><button type="button" onclick="v53Cancel('${id}')">Annulla pratica</button></div></form>`:`<p><b>Importo:</b> ${eur(p.amount)} · <b>Pagamento:</b> ${esc(p.payment)}</p><div class="actions">${p.state==='approvata'?`<button class="primary" onclick="v53Print('${id}')">Stampa / Salva PDF dimostrativo</button><button onclick="v53Email('${id}')">Email manuale</button><button onclick="v53WhatsApp('${id}')">WhatsApp manuale</button>`:''}${p.state==='non_approvata'?`<button onclick="v53PaymentEdit('${id}')">Gestisci pagamento</button><button onclick="v53Reopen('${id}')">Riapri bozza</button>`:''}<button onclick="closeModal()">Chiudi</button></div>`}`;showModal();}
function v53Decision(e,id){e.preventDefault();let p=v53Find(id);if(!p||p.state!=='bozza')return;const d=Object.fromEntries(new FormData(e.target));const action=e.submitter?.value;if(!['approve','unapproved'].includes(action))return;let n=Number(d.amount);if(!Number.isFinite(n)||n<=0){alert('Importo non valido');return}if(d.payment==='Pagato'&&!d.method){alert('Seleziona un metodo di pagamento');return}p.amount=n;p.description=d.description;p.payment=d.payment;p.method=d.payment==='Pagato'?d.method:'';p.state=action==='approve'?'approvata':'non_approvata';if(action==='approve'){p.number='FACSIMILE-'+String(v53Practices.filter(x=>x.state==='approvata').length).padStart(4,'0');v5Log('Bozza fattura approvata (facsimile, non fiscale)',p.id)}else v5Log('Pratica non approvata: documento da regolarizzare',p.id);v53Edit(id)}
function v53PaymentEdit(id){let p=v53Find(id);if(!p||p.state!=='non_approvata')return;document.getElementById('modal').innerHTML=`<h2>Gestisci pagamento</h2><div class="warn">Pratica senza fattura emessa: regolarizzazione fiscale necessaria.</div><form onsubmit="v53SavePayment(event,'${id}')"><p>${esc(pat(p.patient)?.name)} · ${eur(p.amount)}</p><div class="field"><label>Stato</label><select name="payment"><option ${p.payment==='Non pagato'?'selected':''}>Non pagato</option><option ${p.payment==='Pagato'?'selected':''}>Pagato</option></select></div><div class="field"><label>Metodo di pagamento</label><select name="method"><option value="">Nessuno</option>${['Contanti','POS','Bonifico'].map(x=>`<option ${p.method===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="actions"><button class="primary">Salva</button><button type="button" onclick="v53Cancel('${id}')">Annulla pratica</button></div></form>`;showModal()}
function v53SavePayment(e,id){e.preventDefault();let p=v53Find(id);if(!p||p.state!=='non_approvata')return;let d=Object.fromEntries(new FormData(e.target));if(d.payment==='Pagato'&&!d.method){alert('Seleziona il metodo');return}p.payment=d.payment;p.method=d.payment==='Pagato'?d.method:'';v5Log('Pagamento pratica aggiornato',id);v53Edit(id)}
function v53Cancel(id){let p=v53Find(id);if(!p||p.state!=='bozza'&&p.state!=='non_approvata')return;if(!confirm('Annullare questa pratica? Rimarrà nello storico dimostrativo.'))return;p.state='annullata';v5Log('Pratica annullata',id);closeModal();render()}
function v53Reopen(id){let p=v53Find(id);if(!p||p.state!=='non_approvata')return;p.state='bozza';v5Log('Pratica riaperta',id);v53Edit(id)}
function v53Print(id){let p=v53Find(id);if(!p||p.state!=='approvata')return;let a=appointments.find(x=>x.id===p.appointment);let w=window.open('','_blank');if(!w){alert('Abilita i popup per la stampa.');return}let html=`<!doctype html><html lang="it"><head><meta charset="utf-8"><title>Facsimile ${esc(p.number)}</title><style>body{font:16px Arial;padding:45px;max-width:800px;margin:auto}h1{color:#b00020}table{width:100%;border-collapse:collapse}td{padding:12px;border-bottom:1px solid #ddd}.mark{border:3px solid #b00020;padding:15px;color:#b00020;font-weight:bold}</style></head><body><h1>FACSIMILE — NON VALIDO FISCALMENTE</h1><p class="mark">BOZZA DIMOSTRATIVA: NON È UNA FATTURA EMESSA</p><h2>${esc(p.number)}</h2><table><tr><td>Data visita</td><td>${esc(a?.date)}</td></tr><tr><td>Paziente</td><td>${esc(pat(p.patient)?.name)} · ${esc(pat(p.patient)?.cf)}</td></tr><tr><td>Specialista</td><td>${esc(spec(p.specialist)?.name)}</td></tr><tr><td>Descrizione</td><td>${esc(p.description)}</td></tr><tr><td>Importo</td><td>${eur(p.amount)}</td></tr><tr><td>Pagamento</td><td>${esc(p.payment)}</td></tr></table><p>Documento creato esclusivamente per testare la stampa e il salvataggio PDF del browser.</p><script>window.print()<\/script>
</body></html>`;w.document.write(html);w.document.close()}
function v53Email(id){let p=v53Find(id);if(!p||p.state!=='approvata')return;alert('Demo: non viene allegato né inviato alcun PDF. Si apre soltanto una bozza email senza dati sanitari.');location.href='mailto:'+encodeURIComponent(pat(p.patient)?.email||'')+'?subject='+encodeURIComponent('Documento amministrativo - contattare lo studio')+'&body='+encodeURIComponent('Buongiorno, contatti lo studio per ricevere il documento tramite un canale sicuro.')}
function v53WhatsApp(id){let p=v53Find(id);if(!p||p.state!=='approvata')return;let phone=(pat(p.patient)?.phone||'').replace(/\D/g,'');if(!phone){alert('Telefono mancante');return}window.open('https://wa.me/'+(phone.startsWith('39')?phone:'39'+phone)+'?text='+encodeURIComponent('Buongiorno, contatti lo studio per il documento amministrativo.'),'_blank','noopener')}
function v53Table(rows){return rows.length?`<div style="overflow:auto"><table><thead><tr><th>Data</th><th>Paziente</th><th>Specialista</th><th>Importo</th><th>Pratica</th><th>Pagamento</th><th></th></tr></thead><tbody>${rows.map(p=>`<tr><td>${esc(p.date)}</td><td>${esc(pat(p.patient)?.name)}</td><td>${esc(spec(p.specialist)?.name)}</td><td>${p.amount===null?'Da inserire':eur(p.amount)}</td><td>${esc(({bozza:'Da approvare',approvata:'Bozza approvata',non_approvata:'Da regolarizzare',annullata:'Annullata'})[p.state])}</td><td>${esc(p.payment)}</td><td><button onclick="v53Edit('${p.id}')">Apri</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Nessuna pratica generata da appuntamenti conclusi.</p>'}
const v53OldInvoices=renderInvoices;
renderInvoices=function(){v53OldInvoices();let c=document.getElementById('content');let card=document.createElement('div');card.className='card';card.innerHTML=`<h3>Pratiche generate da visite concluse</h3><p class="muted">L'approvazione nella demo non equivale a emissione fiscale. Nessuna trasmissione a SdI o TS.</p>${v53Table(v53Practices)}`;c.appendChild(card)};
const v53OldPatient=renderPatient;
renderPatient=function(){v53OldPatient();if(patientId&&patientTab==='fatture'){let pane=document.getElementById('ptab');if(pane) pane.insertAdjacentHTML('beforeend',`<h3>Pratiche da appuntamenti conclusi</h3>${v53Table(v53Practices.filter(p=>p.patient===patientId))}`)}};
const v53OldAccounting=renderAccounting;
renderAccounting=function(){v53OldAccounting();let c=document.getElementById('content');let approved=v53Practices.filter(p=>p.state==='approvata'),pending=v53Practices.filter(p=>p.state==='non_approvata'),paid=v53Practices.filter(p=>p.state!=='annullata'&&p.state!=='bozza'&&p.payment==='Pagato').reduce((s,p)=>s+p.amount,0);let box=document.createElement('div');box.className='card';box.innerHTML=`<h3>Flusso visite concluse · Demo</h3><p><b>${approved.length}</b> bozze approvate · <b>${pending.length}</b> pratiche da regolarizzare · <b>${eur(paid)}</b> pagamenti registrati in questo flusso</p><p class="muted">Questi importi sono separati dai riepiloghi preesistenti per evitare conteggi doppi. Non rappresentano contabilità fiscale.</p>${v53Table(v53Practices.filter(p=>p.state!=='annullata'))}`;c.appendChild(box)};
</script>

<script>
// PATCH 01 — autenticazione server-side. I dati del gestionale restano demo non persistenti.
(function(){
 const card=document.querySelector('#login .login-card');
 card.innerHTML=`<h1>Studio Manager</h1><p class="muted">Accesso con account personale</p><div class="alert">AMBIENTE DI TEST · NON INSERIRE DATI SANITARI REALI. Le sezioni gestionali restano dimostrative.</div><form id="secure-login"><div class="field"><label for="sm-email">Email</label><input id="sm-email" type="email" autocomplete="username" required></div><div class="field"><label for="sm-password">Password</label><input id="sm-password" type="password" autocomplete="current-password" required></div><div class="field"><label for="sm-code">Codice autenticatore (6 cifre)</label><input id="sm-code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required></div><button class="primary" id="sm-submit">Accedi</button><p class="muted" id="loginerr" role="status"></p></form>`;
 async function call(url,options={}){const response=await fetch(url,{credentials:'same-origin',cache:'no-store',...options});let data={};try{data=await response.json()}catch{}if(!response.ok)throw Error(data.error||'Servizio non disponibile');return data}
 function enter(user){role=user.role;document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';document.getElementById('who').textContent=user.name+' · '+({admin:'Super Admin',segreteria:'Segreteria',specialista:'Specialista'}[user.role]||user.role);page('dashboard');v5SearchUI();v5LimitNav()}
 document.getElementById('secure-login').addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('sm-submit');btn.disabled=true;document.getElementById('loginerr').textContent='Verifica credenziali…';try{const result=await call('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:document.getElementById('sm-email').value,password:document.getElementById('sm-password').value,code:document.getElementById('sm-code').value})});document.getElementById('sm-password').value='';document.getElementById('sm-code').value='';enter(result.user)}catch(err){document.getElementById('loginerr').textContent=err.message}finally{btn.disabled=false}});

 login=function(){document.getElementById('secure-login').requestSubmit()};
 logout=async function(){try{await call('/api/logout',{method:'POST'})}catch{}document.getElementById('app').style.display='none';document.getElementById('login').style.display='grid';v5CloseSearch();document.getElementById('sm-password').value='';document.getElementById('sm-code').value=''};
 call('/api/me').then(x=>enter(x.user)).catch(()=>{});
})();
</script>
